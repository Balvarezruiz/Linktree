<div class="fondo-contacto">
  <section class="seccion-contacto">
    <h1 class="h1">¡Sé parte de nuestra comunidad!</h1>
    <form class="formulario" action="/submit" method="post">
      <label for="nombre">Nombre y apellido:</label>
      <input id="nombre" name="nombre" type="text" required> <br>

      <label for="mail">Correo electrónico:</label>
      <input id="mail" name="mail" type="email" required> <br>

      <label for="cumpleaños">Fecha de cumpleaños:</label>
      <input id="cumpleaños" name="cumpleaños" type="date" required> <br>

      <label for="pais">Selecciona tu país:</label>
      <select id="pais" name="country">
        <option value="Argentina">Argentina</option>
        <option value="Brasil">Brasil</option>
        <option value="Chile">Chile</option>
        <option value="Uruguay">Uruguay</option>
        <option value="Paraguay">Paraguay</option>
      </select>

      <p >¿De qué te gustaría recibir noticias?</p>
      <label><input type="radio" name="intereses" value="tendencias"> Últimas Tendencias</label><br>
      <label><input type="radio" name="intereses" value="historia"> Historia de la moda</label><br>
      <label><input type="radio" name="intereses" value="alta-costura"> Alta costura</label><br>
      <label><input type="radio" name="intereses" value="street"> Street style</label><br>
      <label><input type="radio" name="intereses" value="desfiles"> Últimos desfiles</label><br><br>

      <button type="submit">Enviar</button>
    </form>
  </section>
</div>

        "La moda pasa, el estilo jamás"
